name: DeepWatch official playlists and Quran coverage audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deepwatch-coverage-audit.yml"
      - "scripts/audit-deepwatch-playlists.mjs"
      - "scripts/audit-quran-video-coverage.mjs"
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit official playlists and episode gaps
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/audit-deepwatch-playlists.mjs
      - name: Audit 114 Quran chapters
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-quran-video-coverage.mjs
      - name: Save reviewable rosters and gap reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepwatch-episode-and-quran-audit
          path: audit-reports/*.json
          if-no-files-found: warn
          retention-days: 30
