name: Hourly Islamic Video Discovery
on:
  push:
    branches: [main]
    paths:
      - "scripts/discover-islamic-videos.mjs"
      - ".github/workflows/hourly-video-discovery.yml"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Approved channel ID to scan now (optional)"
        type: string
        default: ""
      run_id:
        description: "Admin dashboard run tracking UUID (optional)"
        type: string
        default: ""
      quran_114:
        description: "Scan all approved channels for Qur’an 114 surah candidates"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover and curate YouTube videos
        env:
          DEEPWATCH_SELECTED_CHANNEL_ID: ${{ inputs.channel_id || '' }}
          DEEPWATCH_DISCOVERY_RUN_ID: ${{ inputs.run_id || '' }}
          DEEPWATCH_QURAN_114: ${{ inputs.quran_114 || false }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DEEPWATCH_APPROVED_CHANNEL_IDS: ${{ secrets.DEEPWATCH_APPROVED_CHANNEL_IDS }}
          DEEPWATCH_EXTRA_APPROVED_CHANNEL_IDS: UCKQkz17Nh6BJZBd0eHhWdJQ,UCvv7gvo7ZtNd0FTUGNdKs1w
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/discover-islamic-videos.mjs
      - name: Discover Somali and Turkish official videos (pending approval)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT2_MAX_PAGES_PER_CHANNEL: "30"
        run: node scripts/discover-deepwatch-bot2.mjs
