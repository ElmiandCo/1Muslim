name: Validate TypeScript and Build
on:
  push:
    branches:
      - main
      - release/v3.9
  pull_request:
    branches:
      - main
      - release/v3.9
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Live Cinema regression tests
        run: node --experimental-strip-types --test scripts/live-cinema.test.mjs scripts/live-cinema-integration.test.mjs
      - name: LiveGuests policy and integration contract tests
        run: node --experimental-strip-types --test scripts/live-guests.test.mjs scripts/live-guests-integration.test.mjs
      - name: Unlocked earned-badge entitlement regression tests
        run: node --experimental-strip-types --test scripts/unlocked-challenge-badges.test.mjs
      - name: v3.9 integrated regression suites
        run: >-
          node --experimental-strip-types --test
          scripts/deepwatch-hero-preview.test.mjs
          scripts/location-onboarding.test.mjs
          scripts/profile-avatar-position.test.mjs
          scripts/member-region-privacy.test.mjs
          scripts/tiktok-import.test.mjs
          scripts/navigation-shell.test.mjs
          scripts/remove-crescent-star-regression.test.mjs
          scripts/search-home-routing.test.mjs
          scripts/web-search-experiences.test.mjs
          scripts/remove-symbol-appwide.test.mjs
          scripts/hudhud-voice-authorization.test.mjs
          scripts/hudhud-website-intent.test.mjs
          scripts/release-receipt.test.mjs
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-publishable-key' }}
