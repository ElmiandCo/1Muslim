<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HudHud Overlay Demo</title><style>body{background:#101a17;color:white;font:16px system-ui;margin:20px}#player{position:relative;max-width:720px;aspect-ratio:9/16;max-height:75vh;background:linear-gradient(145deg,#173e31,#06100c);overflow:hidden;border-radius:18px}button,select{padding:10px;margin:8px}</style><h1>HudHud Overlay — test harness</h1><div id="player"><video controls playsinline style="width:100%;height:100%;object-fit:contain"></video></div><label>Motion <select id="motion"><option>rise</option><option>left</option><option>right</option><option>fade</option></select></label><button id="send">Send sample comment</button><p>Try resizing to mobile width and switching orientation. No network requests are made.</p><script type="module">import { HudHudOverlay } from '../src/index.ts';const overlay=new HudHudOverlay(document.querySelector('#player'));document.querySelector('#send').onclick=()=>overlay.show({id:crypto.randomUUID(),text:'Floating comment works!',author:'HudHud'});document.querySelector('#motion').onchange=e=>overlay.configure({motion:e.target.value});</script></html>
