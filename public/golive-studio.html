const ICONS={"mic":"<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"13\" rx=\"3\"/><path d=\"M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8\"/></svg>","mute":"<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"13\" rx=\"3\"/><path d=\"M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8M3 3l18 18\"/></svg>"};const $=id=>document.getElementById(id);let stream=null,front=true,mic=true,guests=true,live=false,cameraOn=true,effects=false;
async function start(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment'},audio:false});$('video').srcObject=stream;$('video').style.transform=front?'scaleX(-1)':'';await $('video').play();$('fallback').classList.add('hidden')}catch(e){$('fallback').classList.remove('hidden');$('fallback').querySelector('h2').textContent='Camera permission required';$('fallback').querySelector('p').textContent='Allow camera access in your browser. This preview does not require sign-in.';$('retry').classList.remove('hidden')}}
