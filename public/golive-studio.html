</style></head><body><main class="studio"><video id="video" class="video" autoplay playsinline muted></video><div id="fallback" class="fallback"><h2>Opening your camera…</h2><p>No sign-in required. This is a private visual preview.</p><button id="retry" class="hidden">Allow camera</button></div><div class="tint"></div><header><div class="brand"><div class="brandLockup"><span class="archMark">١</span><strong>1Muslim</strong></div></div><div class="actions"><span class="pill"><span class="dot"></span><span id="liveStatus">Preview</span> &nbsp;│&nbsp; <span class="viewerCount">0 watching</span></span><a class="close" href="/" aria-label="Close"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></a></div></header><aside class="tools"><button id="flip" aria-label="Flip camera"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9A7 7 0 0 1 18 6l2 1M4 17l2 1a7 7 0 0 0 12.5-3"/></svg></button><button id="effect" aria-label="Effects"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z"/><path d="m19 17 .7 2.3L22 20l-2.3.7L19 23l-.7-2.3L16 20l2.3-.7L19 17Z"/></svg></button><button id="mic" aria-label="Microphone"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg></button><button id="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="#09291e"/><circle cx="16" cy="17" r="2.5" fill="#09291e"/></svg></button></aside><div id="panel" class="panel"><span>Studio settings</span><button id="cameraToggle">Camera on</button><button id="dismiss">Done ✓</button></div><div class="bottom"><div class="wave"></div><button class="go" id="go" aria-label="Simulate going live">◉</button><h1 id="goLabel">GO LIVE</h1><div class="bismillah">BISMILLAH</div><div class="options" role="group" aria-label="Studio quick settings"><button id="voice" aria-pressed="true"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg></span><b>Voice Chat</b><small id="voiceLabel">On</small></button><button id="camera" aria-label="Switch camera"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="15" height="14" rx="3"/><path d="m17 10 5-3v10l-5-3"/></svg></span><b>Camera</b><small id="cameraLabel">Front</small></button><button id="guests" aria-pressed="false"><span class="ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M2.5 20v-2a6.5 6.5 0 0 1 13 0v2M19 8v8m-4-4h8"/></svg></span><b>Allow Guests</b><small id="guestsLabel">Off</small></button></div></div><div class="note">DESIGN ONLY · CAMERA STAYS ON DEVICE · NOT BROADCASTING</div></main><script>
const ICONS={"mic":"<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"13\" rx=\"3\"/><path d=\"M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8\"/></svg>","mute":"<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"13\" rx=\"3\"/><path d=\"M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8M3 3l18 18\"/></svg>"};const $=id=>document.getElementById(id);let stream=null,front=true,mic=true,guests=false,live=false,cameraOn=true,effects=false;
async function start(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment'},audio:false});$('video').srcObject=stream;$('video').style.transform=front?'scaleX(-1)':'';await $('video').play();$('fallback').classList.add('hidden')}catch(e){$('fallback').classList.remove('hidden');$('fallback').querySelector('h2').textContent='Camera permission required';$('fallback').querySelector('p').textContent='Allow camera access in your browser. This preview does not require sign-in.';$('retry').classList.remove('hidden')}}
$('retry').onclick=start;$('flip').onclick=()=>{front=!front;$('cameraLabel').textContent=front?'Front':'Back';start()};$('camera').onclick=$('flip').onclick;
function toggleMic(){mic=!mic;$('voice').setAttribute('aria-pressed',String(mic));$('voiceLabel').textContent=mic?'On':'Off';$('mic').innerHTML=mic?ICONS.mic:ICONS.mute}$('mic').onclick=toggleMic;$('voice').onclick=toggleMic;
$('guests').onclick=()=>{guests=!guests;$('guests').setAttribute('aria-pressed',String(guests));$('guestsLabel').textContent=guests?'On':'Off'};
$('go').onclick=()=>{live=!live;$('goLabel').textContent=live?'END PREVIEW':'GO LIVE';$('go').textContent=live?'■':'◉';$('liveStatus').textContent=live?'SIMULATED LIVE':'Preview'};
$('settings').onclick=()=>$('panel').classList.toggle('show');$('dismiss').onclick=()=>$('panel').classList.remove('show');
$('cameraToggle').onclick=()=>{cameraOn=!cameraOn;stream?.getVideoTracks().forEach(t=>t.enabled=cameraOn);$('cameraToggle').textContent=cameraOn?'Camera on':'Camera off'};
$('effect').onclick=()=>{effects=!effects;$('video').style.filter=effects?'contrast(1.07) saturate(1.2) brightness(1.06)':''};
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));start();
</script></body></html>
