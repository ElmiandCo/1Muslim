<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041b14"><title>1Muslim · Go Live Studio</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020d09;color:white;font-family:system-ui,-apple-system,sans-serif}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.studio{position:fixed;inset:0;overflow:hidden;isolation:isolate}.video,.tint{position:absolute;inset:0;width:100%;height:100%}.video{object-fit:cover;background:radial-gradient(circle at 45% 42%,#13553c,#02100b 75%)}.tint{pointer-events:none;background:linear-gradient(#00140ca8,transparent 24%,transparent 52%,#00130bc9 86%,#00140ded)}header{position:absolute;z-index:4;top:env(safe-area-inset-top,0px);left:0;right:0;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand,.actions{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;border:2px solid #e5ce87;border-radius:50%;width:61px;height:61px;background:radial-gradient(circle,#08685b,#071a2c);font-size:36px;color:#b6ffe1;box-shadow:0 0 19px #e0c37d77}.brand strong{color:#f5dba1;font-size:clamp(19px,5vw,28px);text-shadow:0 2px 12px #000}.pill{border:1px solid #cbb77e;border-radius:28px;background:#09281ec7;backdrop-filter:blur(12px);padding:11px 12px;font-size:12px;white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#12e595;margin-right:5px}.close{display:grid;place-items:center;width:43px;height:43px;border:1px solid #d6bc7f;border-radius:50%;background:#08251bbf;color:white;font-size:23px;text-decoration:none}.tools{position:absolute;z-index:4;right:12px;top:26%;display:grid;gap:11px;padding:9px 7px;border:1px solid #d8be7a;border-radius:40px;background:#09291cb8;backdrop-filter:blur(16px)}.tools button{width:49px;height:49px;border-radius:50%;border:1px solid #e3c98b;background:#09291ebf;color:white;font-size:24px}.bottom{position:absolute;z-index:4;bottom:0;left:0;right:0;padding:0 17px calc(env(safe-area-inset-bottom,0px) + 33px);text-align:center}.wave{position:absolute;z-index:-1;left:-20%;right:-20%;bottom:139px;height:100px;border-top:2px solid #25e7a48f;border-radius:50%;transform:rotate(-5deg);box-shadow:0 -8px 29px #0bea9d38;pointer-events:none}.go{display:grid;place-items:center;width:118px;height:118px;margin:0 auto;border-radius:50%;border:4px solid #e9d38c;background:radial-gradient(circle at 30% 20%,#22efb1,#007e51 70%);box-shadow:0 0 0 6px #0cde9d3d,0 0 35px #0de6a18c;color:white;font-size:60px}.bottom h1{margin:11px 0 0;font-size:26px;letter-spacing:.12em}.bismillah{font-size:10px;color:#ddc98f;letter-spacing:.36em;margin:4px 0 18px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.options button{min-height:108px;min-width:0;border:1px solid #e1c787;border-radius:22px;background:#06291cc9;backdrop-filter:blur(15px);color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}.options .ico{font-size:29px;color:#16e5a0}.options b{font-size:12px}.options small{color:#9ae4b9}.note{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);left:0;right:0;text-align:center;font-size:8px;letter-spacing:.13em;color:#bdd2c5;z-index:5}.panel{position:absolute;z-index:8;right:79px;top:35%;padding:15px;border:1px solid #d8c180;border-radius:16px;background:#05241bea;display:none;max-width:210px;font-size:12px}.panel.show{display:grid;gap:12px}.panel button{background:#0c6649;border:1px solid #d6bb78;border-radius:10px;color:white;padding:10px}.fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;background:radial-gradient(circle,#175e48,#02130e 73%)}.fallback h2{font-size:20px}.fallback p{font-size:13px;max-width:280px;color:#c1d5c8}.fallback button{background:#087d54;color:white;border:1px solid #d4bc7b;border-radius:22px;padding:12px}.hidden{display:none!important}@media(max-height:670px){.go{height:88px;width:88px;font-size:44px}.options button{min-height:83px}.bottom h1{font-size:20px}.tools{top:22%}}@media(min-width:700px){.studio{max-width:520px;left:50%;transform:translateX(-50%)}} 
</style></head><body><main class="studio"><video id="video" class="video" autoplay playsinline muted></video><div id="fallback" class="fallback"><h2>Opening your camera…</h2><p>No sign-in required. This is a private visual preview.</p><button id="retry" class="hidden">Allow camera</button></div><div class="tint"></div><header><div class="brand"><div class="logo">✦</div><strong>1Muslim</strong></div><div class="actions"><span class="pill"><span class="dot"></span><span id="liveStatus">Preview</span> &nbsp;│&nbsp; ♟ 0</span><a class="close" href="/" aria-label="Close">×</a></div></header><aside class="tools"><button id="flip" aria-label="Flip camera">↻</button><button id="effect" aria-label="Effects">✧</button><button id="mic" aria-label="Microphone">♩</button><button id="settings" aria-label="Settings">⚙</button></aside><div id="panel" class="panel"><span>Studio settings</span><button id="cameraToggle">Camera on</button><button id="dismiss">Done ✓</button></div><div class="bottom"><div class="wave"></div><button class="go" id="go" aria-label="Simulate going live">◉</button><h1 id="goLabel">GO LIVE</h1><div class="bismillah">BISMILLAH</div><div class="options"><button id="voice"><span class="ico">♩</span><b>Voice Chat</b><small id="voiceLabel">On</small></button><button id="camera"><span class="ico">▣</span><b>Camera</b><small id="cameraLabel">Front</small></button><button id="guests"><span class="ico">♧</span><b>Allow Guests</b><small id="guestsLabel">Off</small></button></div></div><div class="note">DESIGN ONLY · CAMERA STAYS ON DEVICE · NOT BROADCASTING</div></main><script>
const $=id=>document.getElementById(id);let stream=null,front=true,mic=true,guests=false,live=false,cameraOn=true,effects=false;
async function start(){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment'},audio:false});$('video').srcObject=stream;$('video').style.transform=front?'scaleX(-1)':'';await $('video').play();$('fallback').classList.add('hidden')}catch(e){$('fallback').classList.remove('hidden');$('fallback').querySelector('h2').textContent='Camera permission required';$('fallback').querySelector('p').textContent='Allow camera access in your browser. This preview does not require sign-in.';$('retry').classList.remove('hidden')}}
$('retry').onclick=start;$('flip').onclick=()=>{front=!front;$('cameraLabel').textContent=front?'Front':'Back';start()};$('camera').onclick=$('flip').onclick;
function toggleMic(){mic=!mic;$('voiceLabel').textContent=mic?'On':'Off';$('mic').textContent=mic?'♩':'×'}$('mic').onclick=toggleMic;$('voice').onclick=toggleMic;
$('guests').onclick=()=>{guests=!guests;$('guestsLabel').textContent=guests?'On':'Off'};
$('go').onclick=()=>{live=!live;$('goLabel').textContent=live?'END PREVIEW':'GO LIVE';$('go').textContent=live?'■':'◉';$('liveStatus').textContent=live?'SIMULATED LIVE':'Preview'};
$('settings').onclick=()=>$('panel').classList.toggle('show');$('dismiss').onclick=()=>$('panel').classList.remove('show');
$('cameraToggle').onclick=()=>{cameraOn=!cameraOn;stream?.getVideoTracks().forEach(t=>t.enabled=cameraOn);$('cameraToggle').textContent=cameraOn?'Camera on':'Camera off'};
$('effect').onclick=()=>{effects=!effects;$('video').style.filter=effects?'contrast(1.07) saturate(1.2) brightness(1.06)':''};
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));start();
</script></body></html>
